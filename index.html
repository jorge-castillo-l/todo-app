<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tareas</title>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="todo__background" aria-hidden="true"></div>
    <main class="todo">
        <header class="todo__header">
            <h1 class="todo__title">Tareas</h1>
        </header>

        <form class="todo__form">
            <span class="todo__drag-spacer" aria-hidden="true"></span>
            <span class="todo__circle"></span>
            <input type="text" name="task" class="todo__input" placeholder="Crea una nueva tarea..." aria-label="Crear una nueva tarea">
        </form>

        <div class="todo__container">
            <ul class="todo__list">
            </ul>

            <div class="todo__footer">
                <span class="todo__items-left">0 tareas pendientes</span>

                <div class="todo__filters-desktop">
                    <button type="button" class="todo__filter todo__filter--active" data-filter="all" aria-pressed="true">Todas</button>
                    <button type="button" class="todo__filter" data-filter="active" aria-pressed="false">Activas</button>
                    <button type="button" class="todo__filter" data-filter="completed" aria-pressed="false">Hechas</button>
                </div>

                <button type="button" class="todo__clear" disabled>Borrar hechas</button>
            </div>
        </div>

        <div class="todo__filters-mobile">
            <button type="button" class="todo__filter todo__filter--active" data-filter="all" aria-pressed="true">Todas</button>
            <button type="button" class="todo__filter" data-filter="active" aria-pressed="false">Activas</button>
            <button type="button" class="todo__filter" data-filter="completed" aria-pressed="false">Hechas</button>
        </div>

        <button type="button" class="todo__export" disabled>Exportar hechas</button>
        <p class="todo__drag-info">Arrastra el asa para reordenar. Haz clic en el nombre para editarlo.</p>
        <p class="todo__live" aria-live="polite" aria-atomic="true"></p>
    </main>

    <dialog class="todo__dialog" aria-labelledby="confirm-message">
        <p id="confirm-message" class="todo__dialog-text"></p>
        <form method="dialog" class="todo__dialog-actions">
            <button type="submit" class="todo__dialog-cancel" value="cancel">Cancelar</button>
            <button type="submit" class="todo__dialog-confirm" value="confirm">Eliminar</button>
        </form>
    </dialog>

    <script src="script.js"></script>
</body>
</html>
